name: Discord Notifications

# ─────────────────────────────────────────────────────────
# SETUP (per repo, done once by each project owner):
# 1. In Discord: Channel Settings → Integrations → Webhooks → New Webhook → Copy URL
# 2. In GitHub repo: Settings → Secrets and variables → Actions → New repository secret
#    Name:  DISCORD_WEBHOOK_URL
#    Value: <paste the Discord webhook URL>
# 3. Copy this file into: .github/workflows/discord-notify.yml
# That's it — no manual GUI webhook config, no unwanted event spam.
# ─────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  push:
    branches: [main, dev]
  create:      # fires for new branches AND new tags — filtered below
  delete:      # fires for deleted branches AND deleted tags — filtered below
  fork:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip create/delete events for tags — we only care about branches
    if: >
      (github.event_name != 'create' && github.event_name != 'delete') ||
      github.event.ref_type == 'branch'
    steps:
      - name: Build and send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.event.repository.html_url }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi

          REPO_NAME="${REPO##*/}"
          MSG1=""
          MSG2=""

          case "$EVENT_NAME" in

            pull_request)
              PR_ACTION="${{ github.event.action }}"
              PR_NUM="${{ github.event.pull_request.number }}"
              PR_URL="${{ github.event.pull_request.html_url }}"
              BASE="${{ github.event.pull_request.base.ref }}"
              HEAD="${{ github.event.pull_request.head.ref }}"
              MERGED="${{ github.event.pull_request.merged }}"

              if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "reopened" ]; then
                MSG1="[New ](${PR_URL})\`PR #${PR_NUM}\`[ opened into](${PR_URL}) \`${BASE}\`  branch (click)"
                MSG2="${ACTOR} opened a pull request from \`${HEAD}\` into \`${BASE}\` in repo: ${REPO_NAME}"
              elif [ "$PR_ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
                MSG1="[Pull Request ](${PR_URL})\`#${PR_NUM}\`[ merged into](${PR_URL}) \`${BASE}\`  branch (click)"
                MSG2="${ACTOR}'s pull request was merged from \`${HEAD}\` into \`${BASE}\` in repo: ${REPO_NAME}"
              elif [ "$PR_ACTION" = "closed" ]; then
                MSG1="[Pull Request ](${PR_URL})\`#${PR_NUM}\`[ closed](${PR_URL}) (not merged)  (click)"
                MSG2="Pull request from \`${HEAD}\` into \`${BASE}\` was closed without merging in repo: ${REPO_NAME}"
              elif [ "$PR_ACTION" = "ready_for_review" ]; then
                MSG1="[Pull Request ](${PR_URL})\`#${PR_NUM}\`[ ready for review](${PR_URL})  (click)"
                MSG2="${ACTOR} marked the pull request into \`${BASE}\` as ready for review in repo: ${REPO_NAME}"
              fi
              ;;

            fork)
              FORK_URL="${{ github.event.forkee.html_url }}"
              MSG1="[Repository forked](${FORK_URL})  (click)"
              MSG2="${ACTOR} forked repo: ${REPO_NAME}"
              ;;

            push)
              BRANCH="${GITHUB_REF#refs/heads/}"
              COMPARE_URL="${{ github.event.compare }}"
              N=$(echo "$COMMITS_JSON" | jq 'length')
              if [ "$N" -eq 1 ]; then S=""; else S="s"; fi
              MSG1="[New ](${COMPARE_URL})\`${N}\`[ Commit${S} on](${COMPARE_URL}) \`${BRANCH}\`  branch (click)"
              MSG2="${ACTOR} pushed ${N} commit${S} into \`${BRANCH}\` in repo: ${REPO_NAME}"
              ;;

            create)
              BRANCH="${{ github.event.ref }}"
              BRANCH_URL="https://github.com/${REPO}/tree/${BRANCH}"
              MSG1="[New branch created](${BRANCH_URL}) \`${BRANCH}\`  (click)"
              MSG2="${ACTOR} created branch \`${BRANCH}\` in repo: ${REPO_NAME}"
              ;;

            delete)
              BRANCH="${{ github.event.ref }}"
              MSG1="[Branch deleted](${REPO_URL}) \`${BRANCH}\`  (click)"
              MSG2="${ACTOR} deleted branch \`${BRANCH}\` in repo: ${REPO_NAME}"
              ;;

          esac

          if [ -z "$MSG1" ]; then
            echo "No message generated for this event/action combo. Skipping."
            exit 0
          fi

          DESCRIPTION=$(printf '%s\n%s' "$MSG1" "$MSG2")

          PAYLOAD=$(jq -n --arg desc "$DESCRIPTION" '{embeds: [{description: $desc}]}')

          curl -sf -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"