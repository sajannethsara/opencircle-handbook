name: Discord Notifications

# ─────────────────────────────────────────────────────────
# SETUP (per repo, done once by each project owner):
# 1. In Discord: Channel Settings → Integrations → Webhooks → New Webhook → Copy URL
# 2. In GitHub repo: Settings → Secrets and variables → Actions → New repository secret
#    Name:  DISCORD_WEBHOOK_URL
#    Value: <paste the Discord webhook URL>
# 3. Copy this file into: .github/workflows/discord-notify.yml
# That's it — no manual GUI webhook config, no unwanted event spam.
# ─────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  push:
    branches: [main, dev]
  create:      # fires for new branches AND new tags — filtered below
  delete:      # fires for deleted branches AND deleted tags — filtered below
  fork:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip create/delete events for tags — we only care about branches
    if: >
      (github.event_name != 'create' && github.event_name != 'delete') ||
      github.event.ref_type == 'branch'
    steps:
      - name: Build and send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi

          MSG=""

          case "$EVENT_NAME" in

            pull_request)
              PR_ACTION="${{ github.event.action }}"
              PR_TITLE="${{ github.event.pull_request.title }}"
              PR_NUM="${{ github.event.pull_request.number }}"
              PR_URL="${{ github.event.pull_request.html_url }}"
              BASE="${{ github.event.pull_request.base.ref }}"
              HEAD="${{ github.event.pull_request.head.ref }}"
              MERGED="${{ github.event.pull_request.merged }}"

              if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "reopened" ]; then
                MSG="${ACTOR} opened a pull request (#${PR_NUM}) in ${REPO}. This is a request to merge their changes from the '${HEAD}' branch into the '${BASE}' branch. The PR is titled \"${PR_TITLE}\". Someone should review it before it gets merged. Link: ${PR_URL}"
              elif [ "$PR_ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
                MSG="${ACTOR}'s pull request (#${PR_NUM}) titled \"${PR_TITLE}\" was merged into '${BASE}' in ${REPO}. This means the changes from '${HEAD}' are now part of the '${BASE}' branch. Link: ${PR_URL}"
              elif [ "$PR_ACTION" = "closed" ]; then
                MSG="Pull request #${PR_NUM} (\"${PR_TITLE}\") in ${REPO} was closed without being merged. The changes from '${HEAD}' were not added to '${BASE}'. Link: ${PR_URL}"
              elif [ "$PR_ACTION" = "ready_for_review" ]; then
                MSG="Pull request #${PR_NUM} (\"${PR_TITLE}\") in ${REPO} is now marked as ready for review. It was previously a draft, but ${ACTOR} has finished the work and it now needs someone to check it. Link: ${PR_URL}"
              fi
              ;;

            fork)
              FORK_URL="${{ github.event.forkee.html_url }}"
              MSG="${ACTOR} forked ${REPO}. Forking means they made their own personal copy of the whole project, which they can freely change without affecting the original. Their copy: ${FORK_URL}"
              ;;

            push)
              BRANCH="${GITHUB_REF#refs/heads/}"
              COMPARE_URL="${{ github.event.compare }}"
              if [ "$BRANCH" = "main" ]; then
                BRANCH_NOTE="the 'main' branch, which usually holds the live/production version of the code"
              elif [ "$BRANCH" = "dev" ]; then
                BRANCH_NOTE="the 'dev' branch, which is used for ongoing development before things are ready for 'main'"
              else
                BRANCH_NOTE="the '${BRANCH}' branch"
              fi
              MSG="${ACTOR} pushed new commit(s) to ${BRANCH_NOTE} in ${REPO}. This means the code on that branch has just changed. You can see exactly what changed here: ${COMPARE_URL}"
              ;;

            create)
              BRANCH="${{ github.event.ref }}"
              MSG="${ACTOR} created a new branch called '${BRANCH}' in ${REPO}. A branch is a separate copy of the code used to work on a feature or fix without touching other branches like 'main' or 'dev' until it's ready."
              ;;

            delete)
              BRANCH="${{ github.event.ref }}"
              MSG="${ACTOR} deleted the branch '${BRANCH}' in ${REPO}. This is usually done after the branch's changes have already been merged elsewhere and the branch is no longer needed."
              ;;

          esac

          if [ -z "$MSG" ]; then
            echo "No message generated for this event/action combo. Skipping."
            exit 0
          fi

          PAYLOAD=$(jq -n --arg content "$MSG" '{content: $content}')

          curl -sf -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"